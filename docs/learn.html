<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>creditlib — own the engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F4; --card:#FBFCFD; --ink:#0F1720; --ink-2:#48586A;
  --navy:#183A5A; --amber:#B26B04; --amber-bg:#FBF0DC;
  --green:#0E6E52; --green-bg:#E1F0EA; --red:#A8322B; --red-bg:#F8E5E3;
  --rule:#C6D0D9; --rule-soft:#DDE4EA;
  --display:'Fraunces',Georgia,serif; --body:'Inter',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}

/* ---------- shell ---------- */
.wrap{max-width:820px;margin:0 auto;padding:28px 20px 120px}
header.top{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1.5px solid var(--ink);padding-bottom:10px;margin-bottom:6px;flex-wrap:wrap;gap:8px}
.brand{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.01em}
.brand span{color:var(--amber)}
.counter{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);letter-spacing:.04em}

/* progress: one tick per module, encodes the dependency chain */
.ticks{display:flex;gap:3px;margin:14px 0 26px}
.tick{flex:1;height:5px;background:var(--rule-soft);border-radius:1px;transition:background .25s}
.tick.done{background:var(--green)}
.tick.here{background:var(--amber)}

/* ---------- card ---------- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:3px;
  padding:30px 32px;box-shadow:0 1px 0 var(--rule-soft)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--amber);font-weight:600;margin-bottom:9px}
h1{font-family:var(--display);font-size:31px;line-height:1.14;margin:0 0 18px;
  font-weight:600;letter-spacing:-.015em}
.teach p{margin:0 0 14px;color:var(--ink)}
.teach p:last-child{margin-bottom:0}
.teach strong{font-weight:600}
.teach em{font-style:italic;color:var(--navy)}
code{font-family:var(--mono);font-size:.89em;background:#E7ECF1;
  padding:1.5px 5px;border-radius:2px}

/* ---------- prediction gate: the signature ---------- */
.gate{margin-top:26px;border-top:1px dashed var(--rule);padding-top:22px}
.gate-label{font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-2);font-weight:600;margin-bottom:4px}
.q{font-weight:600;margin:0 0 15px;font-size:16.5px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;
  background:#fff;border:1px solid var(--rule);border-radius:3px;cursor:pointer;
  transition:border-color .13s,background .13s;text-align:left;font:inherit;color:inherit;width:100%}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.opt.sel{border-color:var(--navy);background:#F1F5F9;border-width:1.5px}
.opt.right{border-color:var(--green);background:var(--green-bg);border-width:1.5px}
.opt.wrong{border-color:var(--red);background:var(--red-bg);border-width:1.5px}
.opt:disabled{cursor:default}
.key{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink-2);
  min-width:15px;padding-top:1px}
.opt.right .key,.opt.wrong .key{color:inherit}

.commit{margin-top:16px;font-family:var(--mono);font-size:13px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;background:var(--navy);color:#fff;
  border:none;padding:12px 22px;border-radius:2px;cursor:pointer;transition:opacity .15s}
.commit:disabled{opacity:.32;cursor:not-allowed}
.commit:hover:not(:disabled){background:#0F2942}

/* ---------- reveal ---------- */
.reveal{margin-top:22px;animation:snap .3s cubic-bezier(.2,.7,.3,1)}
@keyframes snap{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.verdict{font-family:var(--mono);font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;font-weight:600;margin-bottom:9px}
.verdict.ok{color:var(--green)} .verdict.no{color:var(--red)}
.why{background:#F3F6F9;border-left:2.5px solid var(--navy);padding:15px 18px;
  border-radius:0 3px 3px 0;margin-bottom:16px}
.why p{margin:0 0 11px} .why p:last-child{margin:0}

/* engine output block */
.mark{background:#0F1720;color:#DCE4EC;font-family:var(--mono);font-size:13px;
  padding:15px 18px;border-radius:3px;overflow-x:auto;margin-bottom:16px;line-height:1.65}
.mark .lbl{color:#8496A8}
.mark .hi{color:#E8B563;font-weight:600}
.mark .g{color:#5FBF9B}
.mark .r{color:#E5837C}

/* the line to say out loud */
.sayit{border:1.5px solid var(--amber);background:var(--amber-bg);
  padding:15px 18px;border-radius:3px}
.sayit .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--amber);font-weight:600;margin-bottom:7px}
.sayit p{margin:0;font-family:var(--display);font-size:17.5px;line-height:1.45;font-weight:400}

/* ---------- nav ---------- */
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px;align-items:center}
.nav button{font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:.05em;
  background:none;border:1px solid var(--rule);color:var(--ink);padding:10px 18px;
  border-radius:2px;cursor:pointer;transition:border-color .13s}
.nav button:hover:not(:disabled){border-color:var(--ink)}
.nav button:disabled{opacity:.3;cursor:not-allowed}
.nav .next{background:var(--ink);color:#fff;border-color:var(--ink)}
.hintkeys{font-family:var(--mono);font-size:11px;color:var(--ink-2);letter-spacing:.04em}

/* ---------- glossary ---------- */
.gloss-btn{position:fixed;right:18px;bottom:18px;z-index:20;font-family:var(--mono);
  font-size:12px;font-weight:600;letter-spacing:.06em;background:var(--ink);color:#fff;
  border:none;padding:12px 17px;border-radius:2px;cursor:pointer;box-shadow:0 3px 12px rgba(15,23,32,.22)}
.sheet{position:fixed;inset:0;background:rgba(15,23,32,.5);z-index:30;display:none;
  align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet-in{background:var(--card);width:100%;max-width:820px;max-height:82vh;overflow-y:auto;
  border-radius:5px 5px 0 0;padding:26px 30px 34px}
.sheet-in h2{font-family:var(--display);font-size:23px;margin:0 0 4px;font-weight:600}
.sheet-in .sub{color:var(--ink-2);font-size:14px;margin:0 0 18px}
.gterm{border-top:1px solid var(--rule-soft);padding:13px 0}
.gterm dt{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--navy);margin-bottom:4px}
.gterm dd{margin:0;font-size:14.5px;color:var(--ink)}
.closex{float:right;background:none;border:1px solid var(--rule);font-family:var(--mono);
  font-size:12px;padding:6px 12px;border-radius:2px;cursor:pointer}

/* ---------- done ---------- */
.done-card{text-align:left}
.done-card h1{font-size:34px}
.scoreline{font-family:var(--mono);font-size:14px;color:var(--ink-2);margin-bottom:20px}
.checklist{list-style:none;padding:0;margin:0 0 20px}
.checklist li{padding:11px 0;border-top:1px solid var(--rule-soft);display:flex;gap:11px}
.checklist li span:first-child{font-family:var(--mono);color:var(--amber);font-weight:600}
.restart{font-family:var(--mono);font-size:12.5px;font-weight:600;background:none;
  border:1px solid var(--rule);padding:10px 18px;border-radius:2px;cursor:pointer}

@media (max-width:620px){
  .wrap{padding:20px 14px 110px}
  .card{padding:22px 19px}
  h1{font-size:25px}
  .sayit p{font-size:16px}
  .hintkeys{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">creditlib <span>/</span> own the engine</div>
    <div class="counter" id="counter"></div>
  </header>
  <div class="ticks" id="ticks"></div>
  <main id="stage"></main>
</div>

<button class="gloss-btn" id="glossBtn">Glossary</button>
<div class="sheet" id="sheet"><div class="sheet-in">
  <button class="closex" id="closeSheet">Close</button>
  <h2>Terminology</h2>
  <p class="sub">Everything the engine prints, in plain language.</p>
  <dl id="glossList"></dl>
</div></div>

<script>
/* ---------------- storage shim: Claude artifact -> localStorage -> memory ---------------- */
const mem = {};
const store = {
  async get(k){
    try{ if(window.storage){const r=await window.storage.get(k); return r?r.value:null;} }catch(e){}
    try{ return localStorage.getItem(k); }catch(e){}
    return mem[k] ?? null;
  },
  async set(k,v){
    try{ if(window.storage){await window.storage.set(k,v); return;} }catch(e){}
    try{ localStorage.setItem(k,v); return; }catch(e){}
    mem[k]=v;
  }
};

/* ---------------- content ---------------- */
const M = [
{part:"Part 1 · What it is", title:"A CDS is insurance on a company's debt",
 teach:`<p>You hold a bond issued by a company. You're worried they default. So you buy protection: you pay someone a <strong>quarterly premium</strong>, and if the company defaults, they pay you the loss.</p>
<p>That's a credit default swap. Two sides, two streams of money. The buyer pays premium over time. The seller pays a lump sum, once, only if default happens.</p>
<p>The premium is quoted as a <em>spread</em> in basis points per year. "Citi trades at 85bp" means protection on Citigroup costs 0.85% of the notional per year.</p>`,
 q:"You buy 5-year protection on $10m at 85bp. No default occurs. What happened?",
 opts:["You paid roughly $85,000 a year and received nothing","You paid nothing because there was no default","You received $85,000 a year as the protection buyer","You paid a single upfront fee of $85,000"],
 a:0,
 why:`<p>You paid for insurance you didn't need — about $85,000 a year for five years. That's the deal: the buyer bleeds premium in the normal case and gets paid in the bad case.</p>
<p>The <strong>seller</strong> is the mirror image: collects premium, and is exposed to one large loss.</p>`,
 mark:`<span class="lbl">premium leg PV  </span>  447,436.14   <span class="lbl">← what the buyer pays</span>
<span class="lbl">protection leg PV</span>  452,891.28   <span class="lbl">← what the buyer might receive</span>`,
 say:"A CDS is insurance on a company's debt. The buyer pays a quarterly premium; the seller pays the loss if the company defaults."},

{part:"Part 1 · What it is", title:"Your engine has no data feed",
 teach:`<p>This is the question you'll get first, so get it right. <strong>The engine pulls nothing.</strong> No API, no database, no Bloomberg connection.</p>
<p>Every number is typed in by you. <code>QUOTES = {5.0: 0.0105}</code> is you typing 105bp. The five bank spreads came from your own credit work. The discount curve is illustrative — plausible, not real.</p>
<p>This is correct design, not a gap. A pricing library shouldn't have a data vendor welded into it; the two concerns belong in separate layers.</p>`,
 q:"An interviewer asks where your spreads come from. Best answer?",
 opts:["\"I pull them from a market data API at runtime\"","\"I input them. Production would source from Markit or Bloomberg CDSW — the library takes a dict, so it's a data-layer swap\"","\"They're scraped from public filings\"","\"The bootstrap generates them from the discount curve\""],
 a:1,
 why:`<p>Say the true thing first, then show you know where the seam is. Naming Markit or Bloomberg CDSW proves you know the real sourcing path; "the library takes a dict" shows you separated pricing from data on purpose.</p>
<p>Claiming an API you don't have is the fastest way to lose the room — they'll ask which endpoint.</p>`,
 mark:`<span class="lbl">quickstart.py</span>
QUOTES = {1.0: <span class="hi">0.0055</span>, 3.0: <span class="hi">0.0082</span>, 5.0: <span class="hi">0.0105</span>, ...}
<span class="lbl">                    ↑ this is you, typing</span>`,
 say:"There's no feed — I input the quotes. In production they'd come from Markit or Bloomberg CDSW, and since the library takes a dict, that's a data-layer swap, not a pricing change."},

{part:"Part 2 · The machinery", title:"Hazard rate and survival probability",
 teach:`<p>Two quantities, constantly confused.</p>
<p><strong>Survival probability</strong> <code>Q(t)</code> is the chance the company is still alive at time t. Starts at 1, only falls. A probability.</p>
<p><strong>Hazard rate</strong> <code>h(t)</code> is the chance of defaulting in the <em>next instant, given you've survived until now</em>. It's a rate — units of 1/time. It can exceed 1 and nothing is broken.</p>
<p>They're linked by one equation: <code>Q(t) = exp(−∫h)</code>. Survival is the accumulated effect of the hazard.</p>`,
 q:"A name has a hazard rate of 3.0. What does that mean?",
 opts:["A 300% probability of default — the model is broken","An expected time to default of about four months","A 3% annual default probability","The recovery rate is 3%"],
 a:1,
 why:`<p>A hazard of 3.0 means an expected time to default of 1/3 of a year — about four months. It's an <em>intensity</em>, not a probability, so exceeding 1 is legal.</p>
<p>The analogy that sticks: hazard is speed, survival is distance remaining. You can drive at 200 km/h; that doesn't mean you've travelled 200 km.</p>`,
 mark:`<span class="lbl">tenor   hazard_bp    survival     cum_PD</span>
  5.0   <span class="hi">239.53</span>     <span class="g">0.916302</span>   0.083698
<span class="lbl">        ↑ rate       ↑ probability</span>`,
 say:"The hazard rate is a conditional default intensity — the chance of defaulting in the next instant given survival so far. Survival probability is the accumulated effect of it."},

{part:"Part 2 · The machinery", title:"Why the engine works in hazard space",
 teach:`<p>You could model survival probabilities directly. The engine doesn't. Here's the reason, and it's the best design answer in the project.</p>
<p>A survival curve is only valid if it <strong>never rises</strong>. A rising Q would mean a negative probability of defaulting over some window — free money, a genuine arbitrage.</p>
<p>In survival space that's a shape constraint you have to police after the fact. In hazard space it's just <code>h ≥ 0</code> — a sign constraint on a single number. Positivity and the ceiling of 1 come free from the exponential.</p>`,
 q:"Why does parameterising in hazard space make no-arbitrage easier to enforce?",
 opts:["Hazard rates are directly quoted by the market","Because Q = exp(−∫h) is automatically in (0,1], and Q falls if and only if h ≥ 0","Hazard rates are always positive by definition","It makes the numerical integration faster"],
 a:1,
 why:`<p>The exponential does the work. <code>exp(anything)</code> is positive; the integral of a non-negative function only grows; so Q automatically sits in (0,1] and only falls.</p>
<p>Three no-arbitrage conditions collapse into one box constraint on a scalar. That's why <code>CreditCurve</code> rejects negative rates at <em>construction</em>, not at pricing.</p>`,
 mark:`<span class="lbl">>>> CreditCurve([1.0, 2.0], [0.01, -0.001])</span>
<span class="r">ValueError: negative hazard at segment(s) [1]</span>
<span class="lbl">    ← rejected before it can ever price anything</span>`,
 say:"I parameterise in hazard space so no-arbitrage becomes a sign constraint. Q equals exp of minus the integral of h, so positivity and monotonicity are structural rather than policed."},

{part:"Part 2 · The machinery", title:"Two legs, and the par spread",
 teach:`<p>The <strong>protection leg</strong> is what the buyer might receive: the loss given default, paid at the random moment of default, discounted, weighted by the probability it happens.</p>
<p>The <strong>premium leg</strong> is what the buyer pays: quarterly coupons, but only while the company is alive. Multiply each coupon by the survival probability and the discount factor. That sum, per unit of spread, is the <strong>risky annuity</strong> (RPV01).</p>
<p>The <strong>par spread</strong> is the premium that makes the two legs equal — the fair price.</p>`,
 q:"Computing the par spread requires which of these?",
 opts:["An iterative root-finder, because both legs depend on the spread","Simple division — protection leg over risky annuity","A Monte Carlo simulation of default times","Numerical integration on a fine time grid"],
 a:1,
 why:`<p>The protection leg doesn't involve the spread at all. The risky annuity doesn't either — it's the PV of <em>one unit</em> of spread. So the par spread is a quotient, <code>PV_prot / RPV01</code>. No solving.</p>
<p>Worth knowing precisely because the <em>bootstrap</em> does need a solver — but there the unknown is the hazard rate, not the spread.</p>`,
 mark:`<span class="lbl">protection leg PV </span>  452,891.28
<span class="lbl">RPV01 (per unit)  </span>    4.313250
<span class="lbl">                  </span>  ──────────
<span class="lbl">par spread        </span>  <span class="hi">105.0000 bp</span>   <span class="lbl">= 452,891 / (4.31325 × 10m)</span>`,
 say:"The par spread is the protection leg divided by the risky annuity. It's a ratio, not a solve, because neither leg depends on the spread itself."},

{part:"Part 2 · The machinery", title:"Why accrual-on-default exists",
 teach:`<p>Premium accrues continuously but pays quarterly. If default lands mid-quarter, the buyer had protection since the last coupon date and hasn't paid for it. The contract makes them settle that stub.</p>
<p>It sounds like a rounding detail. It isn't. Without it, a CDS would be worth a different amount depending on <em>where in the coupon cycle you traded it</em>.</p>
<p>Buy the day after a coupon date and you'd get up to 90 days of free protection in the default state. Buy the day before and you'd pay a full quarter for one day of cover.</p>`,
 q:"What would break without the accrual-on-default term?",
 opts:["The par spread would be off by a few hundredths of a basis point","Standard fixed-coupon contracts would not be fungible across trade dates","Survival probabilities could exceed 1","The bootstrap would fail to converge"],
 a:1,
 why:`<p>Fungibility is the whole point. The post-2009 contract has a <em>fixed</em> 100bp or 500bp coupon precisely so contracts are interchangeable. That only works if the value doesn't depend on calendar position.</p>
<p>In your engine, adding the term cancels exactly the hazard component of the discretisation error — the residual scales as f/(f+h). Predicted 0.7143, measured 0.7125.</p>`,
 mark:`<span class="lbl">credit triangle h(1−R)      </span> 120.0000 bp
<span class="lbl">quarterly, no accrual       </span> 121.0562 bp
<span class="lbl">quarterly, with accrual     </span> <span class="g">120.7525 bp</span>  <span class="lbl">← closer</span>`,
 say:"Accrual-on-default makes the contract worth the same regardless of where in the coupon cycle you trade it. Without it the standard fixed-coupon contract wouldn't be fungible."},

{part:"Part 3 · The inverse problem", title:"What bootstrapping actually accomplishes",
 teach:`<p>Everything so far went one direction: assume default probabilities, compute the fair premium.</p>
<p>Bootstrapping runs it <strong>backwards</strong>. You observe the premiums the market actually charges. You solve for the default probabilities that would make those premiums fair.</p>
<p>That's the useful direction, and it's the whole point of the engine. It turns market prices into a view of credit risk.</p>`,
 q:"You bootstrap five bank spreads. What have you produced?",
 opts:["A forecast of which banks will default","The default probabilities the market must be assuming, given those prices","A ranking based on fundamental credit analysis","The fair value of each bank's equity"],
 a:1,
 why:`<p>You've extracted an <em>implied</em> view, not made a prediction. The market is charging 85bp for Citi protection; the engine says: for that to be fair, here's the default probability being assumed.</p>
<p>Whether that assumption is <em>right</em> is your job as an analyst. The engine only tells you what's priced in.</p>`,
 mark:`<span class="lbl">FORWARD  </span> hazard curve  <span class="lbl">──→</span>  par spread
<span class="lbl">BACKWARD </span> par spread    <span class="lbl">──→</span>  <span class="hi">hazard curve</span>   <span class="lbl">← the bootstrap</span>`,
 say:"Bootstrapping runs the pricer backwards: from the premiums the market charges, it recovers the default probabilities the market must be assuming."},

{part:"Part 3 · The inverse problem", title:"Bootstrapped hazards are forward quantities",
 teach:`<p>This is the trap. Your 5Y quote is 105bp. The engine returns a hazard of 239.5bp at the 5Y knot. Those look wildly inconsistent — until you see what the hazard is.</p>
<p><code>h₅</code> is <strong>not</strong> the average default intensity over years 0 to 5. It's the marginal intensity over years <strong>3 to 5 only</strong> — what the 5Y quote adds, given what the 1Y and 3Y quotes already told you.</p>
<p>Same relationship as forward rates versus zero rates. Zeros are averages; forwards are marginals, and marginals are always more extreme.</p>`,
 q:"Your bootstrap shows hazards rising 92 → 158 → 240 → 264 → 282bp. What does that tell you?",
 opts:["The name is nearly certain to default within 10 years","Each successive period carries higher marginal default risk than the last","The bootstrap has failed to converge","The spreads must be inverted"],
 a:1,
 why:`<p>Rising forward hazards mean the market prices each successive window as riskier — a normal upward-sloping credit curve. Cumulative default probability over 10 years is 20%, not 282%.</p>
<p>The <code>fwd_spread_bp</code> column translates back: <code>h × (1−R)</code>. The 3–5Y bucket carries a 143.7bp forward spread even though the 5Y quote is 105bp.</p>`,
 mark:`<span class="lbl">tenor  quoted_bp  hazard_bp  fwd_spread_bp    cum_PD</span>
  1.0    55.00      92.44        55.46      0.0077
  3.0    82.00     158.43        95.06      0.0387
  5.0   105.00     <span class="hi">239.53</span>       <span class="hi">143.72</span>      0.0837
<span class="lbl">       ↑ average   ↑ marginal over 3–5Y only</span>`,
 say:"Bootstrapped hazards are forward quantities. The 5Y hazard is the marginal intensity over years three to five, not an average over the whole period."},

{part:"Part 3 · The inverse problem", title:"Why the bootstrap is sequential",
 teach:`<p>Five quotes, five unknown hazards. You could solve all five at once with a multivariate solver. The engine doesn't, and the reason is structural.</p>
<p>A CDS maturing at 5 years only involves survival probabilities up to 5 years — which only depend on the first three hazards. It knows <em>nothing</em> about the 7Y or 10Y buckets.</p>
<p>So the derivative of each equation with respect to any <em>later</em> hazard is exactly zero. The Jacobian is <strong>lower triangular</strong>, and triangular systems solve by forward substitution: one unknown at a time.</p>`,
 q:"You re-quote only the 10Y spread. What happens to the 1Y hazard?",
 opts:["It shifts slightly as the whole curve rebalances","Nothing — it is bit-for-bit identical","It must be re-solved along with everything else","It changes only if the 10Y move exceeds 50bp"],
 a:1,
 why:`<p>Nothing at all. <code>test_locality_of_the_triangular_system</code> asserts this with <code>np.array_equal</code> — exact equality, not approximate.</p>
<p>This isn't a nicety. It's what makes <strong>bucketed CS01 meaningful</strong>: 5Y risk shows up in the 5Y bucket instead of smearing across tenors you never touched.</p>
<p>The flip side: errors propagate <em>forward</em>. A stale 1Y quote poisons every hazard after it.</p>`,
 mark:`<span class="lbl">∂Φₖ/∂hⱼ = 0  for all j > k</span>

     <span class="hi">*</span> 0 0 0 0
     <span class="hi">* *</span> 0 0 0      <span class="lbl">lower triangular</span>
     <span class="hi">* * *</span> 0 0      <span class="lbl">→ five 1-D solves,</span>
     <span class="hi">* * * *</span> 0      <span class="lbl">   not one 5-D solve</span>
     <span class="hi">* * * * *</span>`,
 say:"The Jacobian is lower triangular, because a CDS maturing at year five can't depend on the ten-year hazard. So it solves by forward substitution — five one-dimensional root-finds instead of one five-dimensional one."},

{part:"Part 3 · The inverse problem", title:"When the bootstrap refuses",
 teach:`<p>Each quote is boxed in by the shorter quotes. Below the floor, above the ceiling, and no non-negative hazard can reproduce it.</p>
<p><strong>Too low</strong> — reproducing it needs a negative forward hazard, meaning survival <em>rises</em> over that window. Negative default probability. You'd sell the short leg, buy the long leg, and get paid to own a non-negative claim.</p>
<p><strong>Too high</strong> — it prices protection above the maximum possible loss, given the earlier quotes and the recovery assumption.</p>`,
 q:"Your engine raises InvertedCurveError. What have you learned?",
 opts:["The solver needs a better starting guess","The quote set contains an arbitrage against the shorter quotes","The recovery assumption is too low","Inverted credit curves aren't supported"],
 a:1,
 why:`<p>It's a statement about the <em>data</em>, not the solver. The engine names the tenor, the achievable bound, and the specific trade that exploits it.</p>
<p>Note what does <em>not</em> fail: ordinary inversion. Distressed names invert routinely and bootstrap fine. Only inversion past the no-arbitrage bound is rejected.</p>`,
 mark:`<span class="lbl">feasible window per tenor</span>
  1Y  [    0.00, 119225.26] bp   quoted   55.00  <span class="g">ok</span>
  3Y  [   <span class="hi">16.91</span>,   6587.56] bp   quoted   82.00  <span class="g">ok</span>
  5Y  [   50.32,   1987.17] bp   quoted  105.00  <span class="g">ok</span>
<span class="lbl">       ↑ floor rises, ceiling collapses as you go out</span>`,
 say:"Each quote is bounded above and below by the shorter ones. Outside that window there's an arbitrage in the quote set — the error names the tenor, the bound, and the trade."},

{part:"Part 4 · Reading the output", title:"Recovery is an assumption, not a quote",
 teach:`<p>You feed the engine a recovery rate of 40%. Where does it come from? The ISDA quoting convention for senior unsecured debt. Nobody observed it.</p>
<p>And here's the uncomfortable part: a CDS spread identifies <strong>expected loss</strong> — roughly <code>h × (1−R)</code> — not the hazard on its own. Change R and the implied hazard changes to compensate, repricing the same quotes perfectly.</p>
<p>For bank holding companies it's worse than usual. Holdco senior is the bail-in layer under Title II — designed to absorb losses. Lehman senior settled at 8.625 cents in the 2008 auction, roughly a fifth of the convention.</p>`,
 q:"You bootstrap the same quotes at 40% recovery and again at 20%. What happens?",
 opts:["The 20% run fails to reprice the quotes","Both reprice exactly, but imply different default probabilities","Both give identical default probabilities","The ranking across names reverses"],
 a:1,
 why:`<p>Both reprice to machine precision. Hazards differ by the ratio 0.80/0.60. Implied 5Y default probability moves from 8.37% to 6.34% on identical market data.</p>
<p>So "the market is pricing a 6.8% chance of default" is really "…given someone's recovery assumption."</p>
<p>The saving grace: with a <em>uniform</em> R, h = s/(1−R) is a monotone transform of the spread, so the <strong>ranking across names is invariant</strong>. State the ordering with confidence; state the levels with a caveat.</p>`,
 mark:`<span class="lbl">              R=40%   R=25%   R=10%</span>
JPMorgan      4.76%   3.83%   3.20%
Citigroup     <span class="hi">6.90%</span>   <span class="hi">5.56%</span>   <span class="hi">4.65%</span>
<span class="lbl">              ↑ levels move, order never does</span>`,
 say:"Spreads pin down expected loss, h times one minus R — not h alone. Recovery moves the implied probability levels, but with a uniform assumption the ranking across names is invariant."},

{part:"Part 4 · Reading the output", title:"CS01 and JTD are not substitutes",
 teach:`<p>Four risk numbers, and confusing two of them is the classic error.</p>
<p><strong>CS01</strong> is a derivative: your P&L if spreads widen 1bp. Smooth, small, hedgeable with an index.</p>
<p><strong>JTD</strong> is a discontinuity: your P&L if the name defaults <em>right now</em>. Not a derivative of anything — a cliff.</p>
<p>In your worked example, JTD is about 1,300× CS01.</p>`,
 q:"A desk is CS01-neutral against an index hedge. What risk is untouched?",
 opts:["Interest rate risk, which the index doesn't cover","Idiosyncratic jump-to-default — the index diversifies away exactly what you're exposed to","Recovery rate risk on the index constituents","None; CS01 neutrality covers default risk"],
 a:1,
 why:`<p>An index hedge neutralises co-movement in spreads. It does nothing about <em>one specific name</em> defaulting, because the index is diversified across a hundred names and you're concentrated in one.</p>
<p>That's the 1,300× ratio in practice: a book can be flat on spread risk and still be destroyed by a single default. Which is why desks limit both, separately.</p>`,
 mark:`<span class="lbl">CS01   (+1bp spread)  </span>      4,303.11
<span class="lbl">IR DV01(+1bp rates)   </span>        −17.63   <span class="lbl">0.41% of CS01</span>
<span class="lbl">Rec01  (+1pt recovery)</span>     −7,548.19
<span class="lbl">JTD    (default now)  </span>  <span class="r">5,978,433.75</span>   <span class="lbl">1,389× CS01</span>`,
 say:"CS01 is a smooth sensitivity to spread moves; JTD is the discontinuous loss if the name defaults today. An index hedge can flatten CS01 and leave JTD completely untouched."},

{part:"Part 4 · Reading the output", title:"Risk-neutral is not a forecast",
 teach:`<p>Your five banks imply 5-year default probabilities of 4.7% to 6.8%. Historical default rates for similarly-rated issuers are around 0.56%.</p>
<p>That's a factor of ten. It is not a model error.</p>
<p>CDS-implied probabilities are <strong>risk-neutral</strong> — pricing quantities. The wedge is a risk premium: compensation for jump-to-default, for illiquidity, and for the fact that bank defaults arrive correlated with everything else in a portfolio going wrong at the same time.</p>`,
 q:"Which statement about your Citigroup output is defensible?",
 opts:["\"The market thinks Citi has a 6.8% chance of defaulting in five years\"","\"Citi's CDS implies a 6.8% risk-neutral default probability, roughly 12× historical rates for comparable credits\"","\"Citi will default with 6.8% probability\"","\"6.8% is Citi's expected loss over five years\""],
 a:1,
 why:`<p>The second says what the number <em>is</em> and immediately contextualises the premium. The first and third state a risk-neutral quantity as a real-world forecast, which is wrong and which a credit interviewer will catch instantly.</p>
<p>The fourth confuses probability with loss — expected loss would be that probability times (1−R).</p>`,
 mark:`<span class="lbl">A-rated 5Y historical default rate  </span>  0.56%
<span class="lbl">market-implied range                </span>  <span class="hi">4.70% – 6.81%</span>
<span class="lbl">ratio                               </span>  8.4× – 12.2×
<span class="lbl">                                       ↑ risk premium, not error</span>`,
 say:"These are risk-neutral probabilities, not forecasts. They run about ten times historical default rates, and that wedge is compensation for jump risk, illiquidity, and correlation."},

{part:"Part 5 · Own it", title:"The bug that survived 79 tests",
 teach:`<p>The story you're going to tell. A CDS traded today accrues premium from the previous IMM roll date, so the buyer pays a full first coupon while only owning protection for part of it. The difference is rebated at settlement.</p>
<p>That's the <strong>clean/dirty</strong> distinction, and it means the risky annuity has two versions. The engine used the clean one for the par spread and the dirty one for the mark-to-market.</p>
<p>Result: pricing a contract at its own par spread returned −16,917 instead of zero.</p>`,
 q:"Why did 79 tests, including exact QuantLib parity, miss it?",
 opts:["Floating-point tolerances were set too loosely","Every MTM test used a synthetic schedule with exact 0.25y periods, where the accrued stub is zero","QuantLib has the same bug","The tests only covered the bootstrap, never the pricer"],
 a:1,
 why:`<p>The convenient fixture stripped out the calendar — and the accrued stub <em>is</em> the calendar. On that schedule clean and dirty are numerically identical, so the inconsistency was structurally invisible.</p>
<p>QuantLib missed it too, because the comparison used <code>fairSpread()</code>, which is itself the dirty convention.</p>
<p><strong>The general lesson, and the one worth saying out loud:</strong> convenient test fixtures tend to be degenerate in exactly the dimension you simplified away.</p>`,
 mark:`<span class="lbl">par spread            </span>  <span class="hi">105.0000 bp</span>
<span class="lbl">MTM                   </span>    <span class="r">5,455.14</span>
<span class="lbl">(s_par − s)×RPV01×N   </span>   <span class="r">21,566.25</span>   <span class="lbl">← must be equal</span>
<span class="lbl">gap                   </span>   16,111.11   <span class="lbl">= exactly the accrued coupon</span>`,
 say:"A bug survived 79 tests including QuantLib parity, because every MTM test used a fixture where the accrued stub was zero — so the two conventions coincided. Convenient fixtures are usually degenerate in exactly the dimension you simplified away."},

{part:"Part 5 · Own it", title:"What the project actually demonstrates",
 teach:`<p>Last one, and it's the framing question. Someone asks: "so what does this prove?"</p>
<p>Not that you can price CDS — QuantLib already does that, better. What it demonstrates is a <strong>pipeline</strong>: mathematical definition → derivation → implementation → independent validation → documented failure.</p>
<p>The 25-page methodology document exists so every line is defensible. The defect log exists because six documented bugs with diagnoses is stronger evidence of judgment than zero visible bugs.</p>`,
 q:"Best answer to \"why build this when QuantLib exists?\"",
 opts:["\"Mine is faster than QuantLib\"","\"To learn Python\"","\"To be able to defend every line — QuantLib gives you a number, deriving it yourself gives you the ability to say why it's right and where it breaks\"","\"QuantLib doesn't support CDS pricing\""],
 a:2,
 why:`<p>You validated <em>against</em> QuantLib — so claiming to beat it is both false and easily checked. The honest answer is the strong one: the point was understanding, and the validation proves the understanding is correct rather than merely confident.</p>
<p>Then point at the limitations section. Knowing precisely where your model stops being trustworthy is the thing that separates an analyst from someone running a script.</p>`,
 mark:`<span class="lbl">86 tests passing</span>
<span class="lbl">QuantLib parity  </span>  1e-12 relative
<span class="lbl">repricing error  </span>  <span class="g">4.4e-16</span>  <span class="lbl">← two ULP of a float64</span>
<span class="lbl">documented defects</span>       6  <span class="lbl">← with diagnoses</span>`,
 say:"It proves I can take a definition, derive it, implement it, and prove the implementation is right — including finding and documenting my own mistakes. QuantLib gives you a number; deriving it yourself lets you say why it's right and where it breaks."}
];

const GLOSS = [
["CDS","Credit default swap. Insurance on a company's debt: the buyer pays a quarterly premium, the seller pays the loss if the company defaults."],
["Spread","The premium, quoted in basis points per year. 85bp on $10m is roughly $85,000 a year."],
["Basis point (bp)","One hundredth of a percent. 0.0001 in decimal."],
["Notional","The face amount protected. All the risk numbers scale with it."],
["Recovery rate (R)","What a defaulted bond is assumed to be worth. 40% is the ISDA convention for senior unsecured — a convention, not an estimate."],
["LGD","Loss given default, (1 − R). What the protection seller actually pays out."],
["Hazard rate h(t)","The conditional default intensity — the chance of defaulting in the next instant given survival so far. A rate, not a probability; it can exceed 1."],
["Survival probability Q(t)","The chance the company is still alive at time t. Starts at 1, only falls. Q = exp(−∫h)."],
["Cumulative hazard H(t)","The integral of the hazard rate. Equals −ln Q(t)."],
["Protection leg","PV of the loss payment: (1−R), paid at the random default time, if default happens before maturity."],
["Premium leg","PV of the coupons the buyer pays, weighted by the probability the company is still alive to receive them."],
["Risky annuity / RPV01","The PV of one unit of spread, survival-weighted. Quoted per unit notional as a number of 'years' — about 4.3 for a 5Y."],
["Par spread","The premium that makes both legs equal. Protection leg divided by risky annuity — a ratio, not a solve."],
["MTM","Mark-to-market. The value of an existing position: (par spread − contract coupon) × RPV01 × notional."],
["Accrual on default","The premium stub owed for the period between the last coupon date and default. Exists so contracts are worth the same regardless of when in the coupon cycle you trade."],
["Clean vs dirty","Whether the accrued rebate is netted out. Clean is the market convention for quoting; the two differ by the accrued coupon."],
["IMM dates","The 20th of March, June, September and December. CDS coupons and maturities land on these so contracts are standardised."],
["Bootstrapping","Solving backwards: from observed market spreads to the default probabilities that make them fair."],
["Forward hazard","The marginal intensity over one bucket. The 5Y bootstrapped hazard covers years 3–5 only, not 0–5."],
["Credit triangle","s ≈ h(1−R). Exact when premium is paid continuously with flat rates; a useful sanity check otherwise."],
["Discount curve","Maps a future date to what a dollar then is worth today. Built from log-linear interpolation on discount factors."],
["CS01","P&L for a 1bp widening in spreads. A smooth derivative; hedgeable with an index."],
["JTD","Jump-to-default. P&L if the name defaults right now. A discontinuity, not a derivative — and an index hedge doesn't touch it."],
["IR DV01","P&L for a 1bp move in interest rates. Tiny for a CDS: the two legs largely offset."],
["Risk-neutral","A pricing measure, not a forecast. Implied default probabilities run roughly ten times historical rates because they contain a risk premium."],
["ACT/360, ACT/365F","Day count conventions. ACT/360 governs CDS premium accrual; ACT/365F is the curve's time measure. They are different, deliberately."],
["ISDA","The trade body whose standard model and conventions the CDS market runs on."]
];

/* ---------------- state + render ---------------- */
let i = 0, sel = null, shown = false;
const answers = {};
const stage = document.getElementById('stage');
const ticks = document.getElementById('ticks');
const counter = document.getElementById('counter');
const KEYS = ['A','B','C','D'];

function drawTicks(){
  ticks.innerHTML = M.map((_,k)=>
    `<div class="tick ${k<i?'done':''} ${k===i?'here':''}"></div>`).join('');
  counter.textContent = i<M.length ? `${String(i+1).padStart(2,'0')} / ${M.length}` : 'complete';
}

function render(){
  drawTicks();
  if(i>=M.length){ renderDone(); return; }
  const m = M[i];
  stage.innerHTML = `
  <div class="card">
    <div class="eyebrow">${m.part}</div>
    <h1>${m.title}</h1>
    <div class="teach">${m.teach}</div>
    <div class="gate">
      <div class="gate-label">Make your call</div>
      <p class="q">${m.q}</p>
      <div class="opts" id="opts">
        ${m.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="key">${KEYS[k]}</span><span>${o}</span></button>`).join('')}
      </div>
      <button class="commit" id="commit" disabled>Commit</button>
      <div id="rev"></div>
    </div>
    <div class="nav">
      <button id="prev" ${i===0?'disabled':''}>← Back</button>
      <span class="hintkeys">A–D to pick · Enter to commit · → for next</span>
      <button class="next" id="next" disabled>Next →</button>
    </div>
  </div>`;
  sel = null; shown = false;

  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  document.getElementById('commit').onclick = commit;
  document.getElementById('prev').onclick = ()=>{ if(i>0){i--; render();} };
  document.getElementById('next').onclick = ()=>{ i++; render(); save(); };
  window.scrollTo({top:0,behavior:'instant'});
}

function pick(k){
  if(shown) return;
  sel = k;
  document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel', +b.dataset.k===k));
  document.getElementById('commit').disabled = false;
}

function commit(){
  if(sel===null || shown) return;
  shown = true;
  const m = M[i], ok = sel===m.a;
  answers[i] = ok;
  document.querySelectorAll('.opt').forEach(b=>{
    const k = +b.dataset.k;
    b.disabled = true; b.classList.remove('sel');
    if(k===m.a) b.classList.add('right');
    else if(k===sel) b.classList.add('wrong');
  });
  document.getElementById('commit').style.display='none';
  document.getElementById('rev').innerHTML = `
    <div class="reveal">
      <div class="verdict ${ok?'ok':'no'}">${ok?'Called it':'Not this time'}</div>
      <div class="why">${m.why}</div>
      ${m.mark?`<div class="mark">${m.mark}</div>`:''}
      <div class="sayit"><div class="lbl">Say this out loud</div><p>${m.say}</p></div>
    </div>`;
  document.getElementById('next').disabled = false;
  document.getElementById('next').focus();
}

function renderDone(){
  const right = Object.values(answers).filter(Boolean).length;
  const total = Object.keys(answers).length || M.length;
  stage.innerHTML = `
  <div class="card done-card">
    <div class="eyebrow">Complete</div>
    <h1>Now say it without the screen.</h1>
    <div class="scoreline">${right} / ${total} called correctly</div>
    <div class="teach">
      <p>Recognising the right answer among four is easier than producing it cold. That gap is where the remaining risk lives, so close it deliberately:</p>
    </div>
    <ul class="checklist">
      <li><span>01</span><span><strong>Record the 60-second version.</strong> What the engine does, no jargon. If you reach for "hazard rate", start over.</span></li>
      <li><span>02</span><span><strong>Trace 105bp end to end.</strong> Quote → hazard 239.5bp → survival 0.9163 → PD 8.37%. Every arrow, out loud.</span></li>
      <li><span>03</span><span><strong>Answer three design questions cold.</strong> Why piecewise-flat? Why log-linear on discount factors? Why sequential bootstrapping?</span></li>
      <li><span>04</span><span><strong>Run the Colab notebook and predict each output before running the cell.</strong> Mismatches locate your gaps precisely.</span></li>
      <li><span>05</span><span><strong>Then post.</strong> Not before.</span></li>
    </ul>
    <button class="restart" id="restart">Run it again</button>
  </div>`;
  document.getElementById('restart').onclick = ()=>{ i=0; render(); };
}

/* keyboard */
document.addEventListener('keydown', e=>{
  if(document.getElementById('sheet').classList.contains('open')){
    if(e.key==='Escape') closeSheet(); return;
  }
  const k = KEYS.indexOf(e.key.toUpperCase());
  if(k>-1 && k<(M[i]?.opts.length||0) && !shown){ pick(k); e.preventDefault(); return; }
  if(e.key==='Enter'){ shown ? document.getElementById('next')?.click() : commit(); e.preventDefault(); }
  if(e.key==='ArrowRight' && shown) document.getElementById('next')?.click();
  if(e.key==='ArrowLeft') document.getElementById('prev')?.click();
});

/* glossary */
document.getElementById('glossList').innerHTML =
  GLOSS.map(([t,d])=>`<div class="gterm"><dt>${t}</dt><dd>${d}</dd></div>`).join('');
const sheet = document.getElementById('sheet');
function closeSheet(){ sheet.classList.remove('open'); }
document.getElementById('glossBtn').onclick = ()=>sheet.classList.add('open');
document.getElementById('closeSheet').onclick = closeSheet;
sheet.onclick = e=>{ if(e.target===sheet) closeSheet(); };

/* progress persistence */
async function save(){ await store.set('creditlib_learn_pos', String(i)); }
(async function init(){
  const saved = await store.get('creditlib_learn_pos');
  const n = parseInt(saved,10);
  if(!isNaN(n) && n>0 && n<M.length) i = n;
  render();
})();
</script>
</body>
